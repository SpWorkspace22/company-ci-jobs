- job:
    name: company-sonar-scan
    parent: base
    description: Run the company SonarQube code quality scan.
    run: playbooks/sonar-scan.yaml

- job:
    name: company-security-scan
    parent: base
    description: Run the company security scanning checks.
    run: playbooks/security-scan.yaml

- job:
    name: nodejs-build
    parent: base
    description: Simulate a Node.js application build.
    run: playbooks/nodejs-build.yaml

- job:
    name: nodejs-test
    parent: base
    description: Run Node.js tests after the application build
    dependencies:
      - nodejs-build
    run: playbooks/nodejs-test.yaml

- job:
    name: java-build
    parent: base
    description: Simulate a Java Maven application build.
    vars:
      company_name: "Java Engineering"
      java_toolchain: "Maven"
      build_profile: "standard"
    pre-run:
      - playbooks/java/pre-build.yaml
    run: playbooks/java-build.yaml
    post-run:
      - playbooks/java/post-build.yaml

- job:
    name: python-build
    parent: base
    description: Simulate a Python application build.
    run: playbooks/python-build.yaml
