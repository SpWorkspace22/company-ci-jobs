---
- name: Display security scan starting message
  ansible.builtin.debug:
    msg: "Starting {{ company_security_scan_name }}"

- name: Simulate dependency security check
  ansible.builtin.debug:
    msg: "Running {{ company_security_scan_category }} dependency checks"

- name: Simulate configuration security check
  ansible.builtin.debug:
    msg: "Checking application configuration for security issues"

- name: Display security scan completion message
  ansible.builtin.debug:
    msg: "Security scan simulation completed successfully"

- name: Generate security scan configuration
  ansible.builtin.template:
    src: security-scan.conf.j2
    dest: /tmp/company-security-scan.conf
    mode: "0644"
  notify: Reload security scan configuration

- name: Display generated security scan configuration
  ansible.builtin.command:
    cmd: cat /tmp/company-security-scan.conf
  register: security_scan_config
  changed_when: false

- name: Show generated configuration
  ansible.builtin.debug:
    var: security_scan_config.stdout

- name: Create security scan configuration directory
  ansible.builtin.file:
    path: /tmp/company-security-scan
    state: directory
    mode: "0750"

- name: Create security scan README
  ansible.builtin.copy:
    content: |
      Company Security Scan
      Managed by Ansible through Zuul.
    dest: /tmp/company-security-scan/README.txt
    mode: "0640"

- name: Display security scan directory details
  ansible.builtin.command:
    cmd: ls -ld /tmp/company-security-scan /tmp/company-security-scan/README.txt
  register: security_scan_file_details
  changed_when: false

- name: Show security scan directory details
  ansible.builtin.debug:
    var: security_scan_file_details.stdout
