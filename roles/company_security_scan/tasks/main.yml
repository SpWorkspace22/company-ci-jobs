---
- name: Display security scan starting message
  ansible.builtin.debug:
    msg: "Starting {{ company_security_scan_name }}"

- name: Simulate dependency security check
  ansible.builtin.debug:
    msg: "Checking application dependencies for known vulnerabilities"

- name: Simulate configuration security check
  ansible.builtin.debug:
    msg: "Checking application configuration for security issues"

- name: Display security scan completion message
  ansible.builtin.debug:
    msg: "Security scan simulation completed successfully"
